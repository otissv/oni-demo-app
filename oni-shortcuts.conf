# trigger = action { options }
# User overrides only. Builtins live in the engine.
# Tokens: CTRL+EQUAL, CTRL+WHEEL+UP, LEFT_CLICK, GAMEPAD_START, G,S
# Options: enabled, scope, scope_key, scope_kind, priority, app_type
CTRL+EQUAL = view.zoom_in { app_type = 0 }
CTRL+KP_PLUS = view.zoom_in { app_type = 0 }
CTRL+WHEEL+UP = view.zoom_in { app_type = 0 }
CTRL+MINUS = view.zoom_out { app_type = 0 }
CTRL+KP_MINUS = view.zoom_out { app_type = 0 }
CTRL+WHEEL+DOWN = view.zoom_out { app_type = 0 }
CTRL+0 = view.reset { app_type = 0 }
CTRL+KP_0 = view.reset { app_type = 0 }
F11 = window.toggle_fullscreen { app_type = 0 }
GAMEPAD_START = window.toggle_fullscreen { app_type = 0 }
